<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Logseq Sync Dashboard</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <header><div><small>READ ONLY</small><h1>Logseq Sync</h1></div><div class="status"><i></i><strong id="health">Loading</strong><time id="updated"></time></div></header>
  <main>
    <section><div class="heading"><h2>Overview</h2><span id="freshness"></span></div><div id="overview" class="metrics"></div></section>
    <section><div class="heading"><h2>Graphs</h2><span id="totals"></span></div><div id="activity" class="activity"></div><div id="graphs" class="graphs"></div></section>
  </main>
  <footer>Redacted operational metadata only. Note bodies, asset contents, email addresses and tokens are never read.</footer>
  <script src="./app.js" defer></script>
</body>
</html>
